<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#0d1a2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0084cc"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffcc"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="160" rx="12" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="80" y1="0" x2="80" y2="160"/>
    <line x1="160" y1="0" x2="160" y2="160"/>
    <line x1="240" y1="0" x2="240" y2="160"/>
    <line x1="320" y1="0" x2="320" y2="160"/>
  </g>

  <!-- Network icon — hub + nodes -->
  <!-- Connection lines -->
  <g filter="url(#glow)" opacity="0.7">
    <line x1="60" y1="80" x2="32" y2="52" stroke="#00d4ff" stroke-width="1.5"/>
    <line x1="60" y1="80" x2="32" y2="108" stroke="#00d4ff" stroke-width="1.5"/>
    <line x1="60" y1="80" x2="88" y2="52" stroke="#00d4ff" stroke-width="1.5"/>
    <line x1="60" y1="80" x2="88" y2="108" stroke="#00d4ff" stroke-width="1.5"/>
    <line x1="60" y1="80" x2="20" y2="80" stroke="#00d4ff" stroke-width="1.5"/>
  </g>

  <!-- Outer nodes -->
  <circle cx="32" cy="52" r="5" fill="#0a0f1e" stroke="#00ffcc" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="32" cy="108" r="5" fill="#0a0f1e" stroke="#00ffcc" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="88" cy="52" r="5" fill="#0a0f1e" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="88" cy="108" r="5" fill="#0a0f1e" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="20" cy="80" r="5" fill="#0a0f1e" stroke="#00ffcc" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Center hub -->
  <circle cx="60" cy="80" r="13" fill="url(#nodeGrad)" filter="url(#softGlow)" opacity="0.95"/>
  <circle cx="60" cy="80" r="7" fill="#0a0f1e"/>
  <circle cx="60" cy="80" r="3.5" fill="#00ffcc" filter="url(#glow)"/>

  <!-- Divider line -->
  <line x1="108" y1="35" x2="108" y2="125" stroke="#00d4ff" stroke-width="0.75" opacity="0.3"/>

  <!-- ORTONLABS wordmark -->
  <text
    x="126"
    y="72"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="36"
    font-weight="700"
    letter-spacing="3"
    fill="url(#accentGrad)"
    filter="url(#glow)"
  >ORTON</text>

  <text
    x="128"
    y="108"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="28"
    font-weight="400"
    letter-spacing="10"
    fill="#ffffff"
    opacity="0.55"
  >LABS</text>

  <!-- Top-right corner accent -->
  <rect x="370" y="10" width="20" height="2" rx="1" fill="#00d4ff" opacity="0.4"/>
  <rect x="378" y="14" width="12" height="2" rx="1" fill="#00ffcc" opacity="0.3"/>
</svg>
